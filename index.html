<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Snake Game</title>
    <style>
        :root {
            --bg-color: #121212;
            --text-color: #ffffff;
            --canvas-bg: #1e1e1e;
            --grid-line: #2a2a2a;
            --accent-color: #4CAF50;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            touch-action: none;
        }

        #game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            padding: 15px;
            width: 100%;
            max-width: 500px;
        }

        #score-board {
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 400px;
            font-size: 1.2rem;
            font-weight: bold;
        }

        #canvas-wrapper {
            position: relative;
            width: 100%;
            max-width: 400px;
            aspect-ratio: 1 / 1;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            border-radius: 4px;
            overflow: hidden;
            background-color: var(--canvas-bg);
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            image-rendering: pixelated;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.75);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
        }

        .overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .overlay h1 {
            margin: 0 0 10px 0;
            font-size: 2.5rem;
            color: var(--accent-color);
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }

        .overlay p {
            margin: 5px 0;
            font-size: 1.1rem;
        }

        #pause-screen {
            background-color: rgba(0, 0, 0, 0.5);
        }

        #restart-btn-overlay {
            margin-top: 15px;
            padding: 10px 20px;
            font-size: 1.1rem;
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        /* Mobile Controls */
        #mobile-controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            width: 100%;
            max-width: 300px;
            margin-top: 10px;
        }

        .d-pad {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }

        .d-pad-row {
            display: flex;
            gap: 50px;
        }

        .d-btn {
            width: 60px;
            height: 60px;
            background-color: #333;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.5rem;
            display: flex;
            justify-content: center;
            align-items: center;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .d-btn:active {
            background-color: #555;
        }

        .action-buttons {
            display: flex;
            width: 100%;
            justify-content: center;
        }

        .action-btn {
            padding: 12px 30px;
            background-color: #444;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            user-select: none;
        }

        .action-btn:active {
            background-color: #666;
        }

        @media (min-width: 768px) {
            #mobile-controls {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div id="game-container">
        <!-- UI Headers for Scores -->
        <div id="score-board">
            <div>Score: <span id="current-score">0</span></div>
            <div>High Score: <span id="high-score">0</span></div>
        </div>

        <!-- The Game Canvas -->
        <div id="canvas-wrapper">
            <canvas id="game-canvas" width="400" height="400"></canvas>

            <!-- Overlays -->
            <div id="start-screen" class="overlay active">
                <h1>Snake</h1>
                <p>High Score: <span id="start-high-score">0</span></p>
                <p>Press Space or Tap to Start</p>
            </div>

            <div id="pause-screen" class="overlay">
                <h1>PAUSED</h1>
            </div>

            <div id="game-over-screen" class="overlay">
                <h1>Game Over</h1>
                <p>Score: <span id="final-score">0</span></p>
                <p id="new-high-score-msg" style="display: none; color: #ffeb3b;">New High Score!</p>
                <p>Press Space or Tap to Play Again</p>
                <button id="restart-btn-overlay" aria-label="Play Again">Play Again</button>
            </div>
        </div>

        <!-- Mobile Controls -->
        <div id="mobile-controls">
            <div class="d-pad">
                <button id="btn-up" class="d-btn" aria-label="Move Up">▲</button>
                <div class="d-pad-row">
                    <button id="btn-left" class="d-btn" aria-label="Move Left">◄</button>
                    <button id="btn-right" class="d-btn" aria-label="Move Right">►</button>
                </div>
                <button id="btn-down" class="d-btn" aria-label="Move Down">▼</button>
            </div>
            <div class="action-buttons">
                <button id="btn-pause" class="action-btn" aria-label="Pause or Resume Game">Pause/Resume</button>
            </div>
        </div>
    </div>

    <script>
        // Constants & DOM Elements
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        const currentScoreEl = document.getElementById('current-score');
        const highScoreEl = document.getElementById('high-score');
        const startHighScoreEl = document.getElementById('start-high-score');
        const finalScoreEl = document.getElementById('final-score');
        const newHighScoreMsg = document.getElementById('new-high-score-msg');

        const startScreen = document.getElementById('start-screen');
        const pauseScreen = document.getElementById('pause-screen');
        const gameOverScreen = document.getElementById('game-over-screen');

        // Game Configuration
        const GRID_SIZE = 20;
        const CELL_SIZE = canvas.width / GRID_SIZE;

        // Initial Game State Variables
        let snake = [];
        let food = { x: 0, y: 0 };
        let dx = 1;
        let dy = 0;
        let directionQueue = [];
        let score = 0;
        let highScore = parseInt(localStorage.getItem('snakeHighScore')) || 0;
        let foodEatenCount = 0;

        let gameLoopId = null;
        let lastTime = 0;

        // Speed settings
        const BASE_SPEED = 200;
        const MIN_SPEED = 50;
        const SPEED_DECREMENT = 10;
        let currentSpeed = BASE_SPEED;
        let timeSinceLastMove = 0;

        // Game States Enum
        const GameState = {
            START: 'START',
            PLAYING: 'PLAYING',
            PAUSED: 'PAUSED',
            GAMEOVER: 'GAMEOVER'
        };
        let currentState = GameState.START;

        // Setup on load
        highScoreEl.innerText = highScore;
        startHighScoreEl.innerText = highScore;

        function initGame() {
            let startX = Math.floor(GRID_SIZE / 2);
            let startY = Math.floor(GRID_SIZE / 2);

            snake = [
                { x: startX, y: startY },
                { x: startX - 1, y: startY },
                { x: startX - 2, y: startY }
            ];

            dx = 1;
            dy = 0;
            directionQueue = [];
            score = 0;
            foodEatenCount = 0;
            currentSpeed = BASE_SPEED;
            timeSinceLastMove = 0;

            currentScoreEl.innerText = score;
            newHighScoreMsg.style.display = 'none';

            placeFood();

            currentState = GameState.PLAYING;
            startScreen.classList.remove('active');
            gameOverScreen.classList.remove('active');
            pauseScreen.classList.remove('active');

            if (gameLoopId) cancelAnimationFrame(gameLoopId);
            lastTime = performance.now();
            gameLoopId = requestAnimationFrame(gameLoop);
        }

        function gameOver() {
            currentState = GameState.GAMEOVER;
            cancelAnimationFrame(gameLoopId);
            gameLoopId = null;

            finalScoreEl.innerText = score;

            if (score > highScore) {
                highScore = score;
                localStorage.setItem('snakeHighScore', highScore);
                highScoreEl.innerText = highScore;
                newHighScoreMsg.style.display = 'block';
            }

            gameOverScreen.classList.add('active');
        }

        function placeFood() {
            let valid = false;
            while (!valid) {
                food.x = Math.floor(Math.random() * GRID_SIZE);
                food.y = Math.floor(Math.random() * GRID_SIZE);

                valid = true;
                for (let part of snake) {
                    if (part.x === food.x && part.y === food.y) {
                        valid = false;
                        break;
                    }
                }
            }
        }

        function moveSnake() {
            if (directionQueue.length > 0) {
                const nextDir = directionQueue.shift();
                dx = nextDir.dx;
                dy = nextDir.dy;
            }

            const head = { x: snake[0].x + dx, y: snake[0].y + dy };

            // Wall Collision Check
            if (head.x < 0 || head.x >= GRID_SIZE || head.y < 0 || head.y >= GRID_SIZE) {
                gameOver();
                return;
            }

            // Food Collision
            let ateFood = (head.x === food.x && head.y === food.y);

            // Self Collision Check (tail moves unless ate food)
            let checkLength = ateFood ? snake.length : snake.length - 1;
            for (let i = 0; i < checkLength; i++) {
                if (head.x === snake[i].x && head.y === snake[i].y) {
                    gameOver();
                    return;
                }
            }

            snake.unshift(head);

            if (ateFood) {
                score += 10;
                foodEatenCount++;
                currentScoreEl.innerText = score;

                placeFood();

                if (foodEatenCount % 5 === 0) {
                    currentSpeed = Math.max(MIN_SPEED, currentSpeed - SPEED_DECREMENT);
                }
            } else {
                snake.pop();
            }
        }

        function setDirection(newDx, newDy) {
            if (currentState !== GameState.PLAYING) return;

            if (directionQueue.length >= 2) return;

            let currentDx = directionQueue.length > 0 ? directionQueue[directionQueue.length - 1].dx : dx;
            let currentDy = directionQueue.length > 0 ? directionQueue[directionQueue.length - 1].dy : dy;

            if ((newDx !== 0 && currentDx === -newDx) || (newDy !== 0 && currentDy === -newDy)) {
                return;
            }

            directionQueue.push({ dx: newDx, dy: newDy });
        }

        function togglePause() {
            if (currentState === GameState.PLAYING) {
                currentState = GameState.PAUSED;
                pauseScreen.classList.add('active');
            } else if (currentState === GameState.PAUSED) {
                currentState = GameState.PLAYING;
                pauseScreen.classList.remove('active');
                lastTime = performance.now();
                gameLoopId = requestAnimationFrame(gameLoop);
            }
        }

        function handleInteraction() {
            if (currentState === GameState.START || currentState === GameState.GAMEOVER) {
                initGame();
            } else if (currentState === GameState.PLAYING || currentState === GameState.PAUSED) {
                togglePause();
            }
        }

        // Keyboard Controls
        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') {
                e.preventDefault();
                setDirection(0, -1);
            } else if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') {
                e.preventDefault();
                setDirection(0, 1);
            } else if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') {
                e.preventDefault();
                setDirection(-1, 0);
            } else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') {
                e.preventDefault();
                setDirection(1, 0);
            } else if (e.key === ' ') {
                e.preventDefault();
                handleInteraction();
            }
        });

        // Overlay Click/Touch Controls
        startScreen.addEventListener('click', handleInteraction);
        gameOverScreen.querySelector('button').addEventListener('click', (e) => {
            e.stopPropagation();
            initGame();
        });

        document.getElementById('canvas-wrapper').addEventListener('click', (e) => {
            if (currentState === GameState.START || currentState === GameState.GAMEOVER) {
                initGame();
            }
        });

        // Mobile Button Controls
        document.getElementById('btn-up').addEventListener('click', (e) => { e.preventDefault(); setDirection(0, -1); });
        document.getElementById('btn-down').addEventListener('click', (e) => { e.preventDefault(); setDirection(0, 1); });
        document.getElementById('btn-left').addEventListener('click', (e) => { e.preventDefault(); setDirection(-1, 0); });
        document.getElementById('btn-right').addEventListener('click', (e) => { e.preventDefault(); setDirection(1, 0); });
        document.getElementById('btn-pause').addEventListener('click', (e) => {
            e.preventDefault();
            handleInteraction();
        });

        function gameLoop(timestamp) {
            if (currentState !== GameState.PLAYING) return;

            const deltaTime = timestamp - lastTime;
            lastTime = timestamp;

            timeSinceLastMove += deltaTime;

            if (timeSinceLastMove >= currentSpeed) {
                moveSnake();
                timeSinceLastMove = 0;
            }

            draw();

            if (currentState === GameState.PLAYING) {
                gameLoopId = requestAnimationFrame(gameLoop);
            }
        }

        function draw() {
            // Clear canvas
            ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--canvas-bg').trim() || '#1e1e1e';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw Grid lines
            ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--grid-line').trim() || '#2a2a2a';
            ctx.lineWidth = 1;
            for (let i = 0; i <= canvas.width; i += CELL_SIZE) {
                ctx.beginPath();
                ctx.moveTo(i, 0);
                ctx.lineTo(i, canvas.height);
                ctx.stroke();
            }
            for (let i = 0; i <= canvas.height; i += CELL_SIZE) {
                ctx.beginPath();
                ctx.moveTo(0, i);
                ctx.lineTo(canvas.width, i);
                ctx.stroke();
            }

            // Draw Food
            ctx.fillStyle = '#ff5252';
            ctx.fillRect(food.x * CELL_SIZE + 1, food.y * CELL_SIZE + 1, CELL_SIZE - 2, CELL_SIZE - 2);

            // Draw Snake
            for (let i = 0; i < snake.length; i++) {
                const part = snake[i];
                if (i === 0) {
                    ctx.fillStyle = '#2e7d32';
                    ctx.fillRect(part.x * CELL_SIZE, part.y * CELL_SIZE, CELL_SIZE, CELL_SIZE);

                    ctx.fillStyle = 'white';
                    if (dx === 1) {
                        ctx.fillRect(part.x * CELL_SIZE + CELL_SIZE - 6, part.y * CELL_SIZE + 4, 4, 4);
                        ctx.fillRect(part.x * CELL_SIZE + CELL_SIZE - 6, part.y * CELL_SIZE + CELL_SIZE - 8, 4, 4);
                    } else if (dx === -1) {
                        ctx.fillRect(part.x * CELL_SIZE + 2, part.y * CELL_SIZE + 4, 4, 4);
                        ctx.fillRect(part.x * CELL_SIZE + 2, part.y * CELL_SIZE + CELL_SIZE - 8, 4, 4);
                    } else if (dy === 1) {
                        ctx.fillRect(part.x * CELL_SIZE + 4, part.y * CELL_SIZE + CELL_SIZE - 6, 4, 4);
                        ctx.fillRect(part.x * CELL_SIZE + CELL_SIZE - 8, part.y * CELL_SIZE + CELL_SIZE - 6, 4, 4);
                    } else if (dy === -1) {
                        ctx.fillRect(part.x * CELL_SIZE + 4, part.y * CELL_SIZE + 2, 4, 4);
                        ctx.fillRect(part.x * CELL_SIZE + CELL_SIZE - 8, part.y * CELL_SIZE + 2, 4, 4);
                    }
                } else {
                    ctx.fillStyle = '#4CAF50';
                    ctx.fillRect(part.x * CELL_SIZE + 1, part.y * CELL_SIZE + 1, CELL_SIZE - 2, CELL_SIZE - 2);
                }
            }
        }

        draw();
    </script>
</body>
</html>
